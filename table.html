<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Table - Budget Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="top-header">

        <div class="logo-area">

            <img src="logo.png" alt="Budget Tracker Logo">

        </div>


        <nav class="main-nav">

            <a href="index.html">
                🏠 Home
            </a>

            <a href="table.html" class="active">
                📊 Table
            </a>

            <a href="market.html">
                🛒 Market
            </a>

            <a href="business.html">
                💼 Business
            </a>

        </nav>

    </header>


    <main>

        <section class="table-section">

            <h2>📊 Budget Table</h2>

            <p>
                Track your expenses and manage your budget.
            </p>


            <form id="budgetForm" class="budget-form">

                <input
                    type="text"
                    id="description"
                    placeholder="Expense name"
                    required
                >


                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    required
                >


                <select id="category" required>

                    <option value="">
                        Select category
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <button type="submit">
                    ADD EXPENSE
                </button>

            </form>


            <table>

               <thead>

    <tr>

        <th>Expense Name</th>
        <th>Amount</th>
        <th>Category</th>
        <th>Date</th>
        <th>Action</th>

    </tr>

</thead>


                <tbody id="budgetTableBody">

                </tbody>

            </table>


            <div class="total-section">

                <h3>
                    Total Expenses:
                    KSh
                    <span id="totalAmount">0</span>
                </h3>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
